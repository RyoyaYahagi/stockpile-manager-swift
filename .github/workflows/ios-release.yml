name: iOS Release

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "実行する fastlane レーン"
        required: true
        default: beta
        type: choice
        options:
          - beta
          - release
      build_number:
        description: "任意の build number。空なら App Store Connect の最新値 + 1 を使用"
        required: false
        type: string
      submit_for_review:
        description: "release 実行時に審査提出する"
        required: true
        default: false
        type: boolean
      automatic_release:
        description: "release 実行時に審査通過後すぐ公開する"
        required: true
        default: false
        type: boolean

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      CI: "true"
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      ASC_KEY_CONTENT_BASE64: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CLOUDKIT_CONTAINER_ID: iCloud.com.stockpile-manager.app
      CLOUDKIT_MANAGEMENT_TOKEN: ${{ secrets.CLOUDKIT_MANAGEMENT_TOKEN }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_READONLY: "true"
      BUILD_NUMBER: ${{ inputs.build_number }}
      APPSTORE_SUBMIT_FOR_REVIEW: ${{ inputs.submit_for_review }}
      APPSTORE_AUTOMATIC_RELEASE: ${{ inputs.automatic_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Security preflight
        run: bash scripts/release_security_preflight.sh

      - name: Test backend
        run: |
          npm ci --prefix backend/cloudflare-product-search-api
          npm run check --prefix backend/cloudflare-product-search-api
          npm test --prefix backend/cloudflare-product-search-api

      - name: Test iOS
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')"
          if [[ -z "$SIMULATOR_ID" || "$SIMULATOR_ID" == "null" ]]; then
            echo "No available iPhone Simulator" >&2
            exit 1
          fi
          xcodebuild test \
            -project Stockpile.xcodeproj \
            -scheme Stockpile \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/stockpile-derived-data"

      - name: Run fastlane
        run: bundle exec fastlane ios ${{ inputs.lane }}
